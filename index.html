<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>永遠にしりとり</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --highlight: #06b6d4;
      --btn-bg: #1e293b;
      --btn-active: #0284c7;
      --user-msg: #0369a1;
      --cpu-msg: #334155;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      padding: 12px 16px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .title {
      font-size: 18px;
      font-weight: bold;
      color: var(--accent);
    }
    .top-btns button {
      background: #334155;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      margin-left: 6px;
    }
    .stats {
      display: flex;
      justify-content: space-around;
      padding: 8px 16px;
      background: #0284c715;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      flex-shrink: 0;
    }
    .stat-val {
      font-weight: bold;
      color: var(--accent);
      font-size: 16px;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.4;
      word-break: break-all;
    }
    .msg-user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 2px;
    }
    .msg-cpu {
      align-self: flex-start;
      background: var(--cpu-msg);
      border-bottom-left-radius: 2px;
    }
    .dict-link {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      color: #7dd3fc;
      text-decoration: underline;
      cursor: pointer;
    }
    /* 入力エリアの明確な可視化とスタイル設定 */
    .input-display {
      background: #0f172a;
      border-top: 2px solid var(--accent);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      flex-shrink: 0;
    }
    .current-text-container {
      flex: 1;
      display: flex;
      align-items: center;
      margin-right: 12px;
      overflow-x: auto;
    }
    .current-text {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #38bdf8;
      min-height: 30px;
      line-height: 30px;
      white-space: nowrap;
    }
    .placeholder-text {
      color: var(--subtext);
      font-size: 14px;
      font-weight: normal;
      letter-spacing: normal;
    }
    .action-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
    }
    .action-btn:active {
      background: #dc2626;
    }
    .pad-container {
      background: #090d16;
      padding: 8px 8px 90px 8px; /* スマホ浮遊ボタン対策のボトム余白90px */
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .row-selector {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }
    .row-btn {
      flex: 1;
      min-width: 40px;
      padding: 8px 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
    }
    .row-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      border-color: var(--accent);
    }
    .char-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 8px;
    }
    .char-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .char-btn:active {
      background: var(--btn-active);
    }
    .ctrl-grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 6px;
    }
    .ctrl-btn {
      background: #334155;
      border: none;
      color: #fff;
      padding: 12px 0;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
    }
    .ctrl-btn:active {
      background: #475569;
    }
    .submit-btn {
      background: #0284c7;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">永遠にしりとり</div>
    <div class="top-btns">
      <button onclick="toggleMode()" id="mode-label">VS CPU</button>
      <button onclick="resetGame()">リセット</button>
    </div>
  </header>

  <div class="stats">
    <div>ターン: <span class="stat-val" id="turn-count">1</span></div>
    <div>つなぎ文字: <span class="stat-val" id="target-char">り</span></div>
  </div>

  <div class="chat-area" id="chat-area">
    <div class="msg-bubble msg-cpu">
      【スタート】しりとり<br>
      「り」から始まる言葉を入力してね！
    </div>
  </div>

  <!-- 入力可視化エリア -->
  <div class="input-display">
    <div class="current-text-container">
      <div class="current-text" id="input-view"></div>
    </div>
    <button class="action-btn" onclick="clearInput()">一字削除</button>
  </div>

  <div class="pad-container">
    <div class="row-selector" id="row-selector"></div>
    <div class="char-grid" id="char-grid"></div>
    <div class="ctrl-grid">
      <button class="ctrl-btn" onclick="toggleTransform()">゛゜小</button>
      <button class="ctrl-btn submit-btn" onclick="submitWord()">送信</button>
    </div>
  </div>

  <script>
    const ROWS = {
      'あ行': ['あ','い','う','え','お'],
      'か行': ['か','き','く','け','こ'],
      'さ行': ['さ','し','す','せ','そ'],
      'た行': ['た','ち','つ','て','と'],
      'な行': ['な','に','ぬ','ね','の'],
      'は行': ['は','ひ','ふ','へ','ほ'],
      'ま行': ['ま','み','む','め','も'],
      'や行': ['や','ゆ','よ'],
      'ら行': ['ら','り','る','れ','ろ'],
      'わ行': ['わ','を','ん','ー']
    };

    const DICT = [
      "りんご","りす","りぼん","りゅう","りか","らいおん","らくだ","らっこ","らっぱ",
      "すいか","すずめ","すし","すみれ","さくら","さかな","さる","さとう",
      "うし","うさぎ","うみ","うた","えほん","えんぴつ","えび",
      "おおかみ","おにぎり","おもちゃ","かめ","からす","かぶとむし",
      "きつね","きりん","きのこ","くま","くじら","くるま","くり",
      "けいさつ","けーき","ねこ","いぬ","ひこうき","ふね","まいく"
    ];

    let currentInput = "";
    let targetChar = "り";
    let usedWords = new Set(["しりとり"]);
    let turn = 1;
    let currentRow = "ら行";
    let isCpuMode = true;

    function init() {
      renderRowSelector();
      renderCharGrid();
      updateTargetRow();
      updateInputDisplay();
    }

    function renderRowSelector() {
      const container = document.getElementById('row-selector');
      container.innerHTML = "";
      Object.keys(ROWS).forEach(row => {
        const btn = document.createElement('div');
        btn.className = `row-btn ${row === currentRow ? 'active' : ''}`;
        btn.innerText = row;
        btn.onclick = () => {
          currentRow = row;
          renderRowSelector();
          renderCharGrid();
        };
        container.appendChild(btn);
      });
    }

    function renderCharGrid() {
      const grid = document.getElementById('char-grid');
      grid.innerHTML = "";
      ROWS[currentRow].forEach(char => {
        const btn = document.createElement('div');
        btn.className = "char-btn";
        btn.innerText = char;
        btn.onclick = () => {
          currentInput += char;
          updateInputDisplay();
        };
        grid.appendChild(btn);
      });
    }

    function updateTargetRow() {
      for (const [row, chars] of Object.entries(ROWS)) {
        if (chars.includes(targetChar)) {
          currentRow = row;
          renderRowSelector();
          renderCharGrid();
          break;
        }
      }
    }

    function updateInputDisplay() {
      const view = document.getElementById('input-view');
      if (currentInput === "") {
        view.innerHTML = `<span class="placeholder-text">「${targetChar}」から入力...</span>`;
      } else {
        view.innerText = currentInput;
      }
    }

    function clearInput() {
      if (currentInput.length > 0) {
        currentInput = currentInput.slice(0, -1);
        updateInputDisplay();
      }
    }

    function toggleTransform() {
      if (!currentInput) return;
      let last = currentInput.slice(-1);

      const cycleMap = {
        'か':'が', 'が':'か',
        'き':'ぎ', 'ぎ':'き',
        'く':'ぐ', 'ぐ':'く',
        'け':'げ', 'げ':'け',
        'こ':'ご', 'ご':'こ',
        'さ':'ざ', 'ざ':'さ',
        'し':'じ', 'じ':'し',
        'す':'ず', 'ず':'す',
        'せ':'ぜ', 'ぜ':'せ',
        'そ':'ぞ', 'ぞ':'そ',
        'た':'だ', 'だ':'た',
        'ち':'ぢ', 'ぢ':'ち',
        'つ':'づ', 'づ':'っ', 'っ':'つ',
        'て':'で', 'で':'て',
        'と':'ど', 'ど':'と',
        'は':'ば', 'ば':'ぱ', 'ぱ':'は',
        'ひ':'び', 'び':'ぴ', 'ぴ':'ひ',
        'ふ':'ぶ', 'ぶ':'ぷ', 'ぷ':'ふ',
        'へ':'べ', 'べ':'ぺ', 'ぺ':'へ',
        'ほ':'ぼ', 'ぼ':'ぽ', 'ぽ':'ほ',
        'あ':'ぁ', 'ぁ':'あ',
        'い':'ぃ', 'ぃ':'い',
        'う':'ぅ', 'ぅ':'う',
        'え':'ぇ', 'ぇ':'え',
        'お':'ぉ', 'ぉ':'お',
        'や':'ゃ', 'ゃ':'や',
        'ゆ':'ゅ', 'ゅ':'ゆ',
        'よ':'ょ', 'ょ':'よ'
      };

      if (cycleMap[last]) {
        currentInput = currentInput.slice(0, -1) + cycleMap[last];
        updateInputDisplay();
      }
    }

    function submitWord() {
      if (!currentInput) return;
      
      if (currentInput[0] !== targetChar) {
        alert(`「${targetChar}」から始まる言葉を入力してください！`);
        return;
      }
      if (currentInput.slice(-1) === 'ん') {
        alert("「ん」で終わる言葉は使えません！");
        return;
      }
      if (usedWords.has(currentInput)) {
        alert("すでに使われた言葉です！");
        return;
      }

      usedWords.add(currentInput);
      addMsg(currentInput, 'user');
      
      targetChar = getNextChar(currentInput);
      turn++;
      document.getElementById('turn-count').innerText = turn;
      document.getElementById('target-char').innerText = targetChar;
      
      currentInput = "";
      updateInputDisplay();
      updateTargetRow();

      if (isCpuMode) {
        setTimeout(cpuTurn, 800);
      }
    }

    function getNextChar(word) {
      let last = word.slice(-1);
      if (last === 'ー' && word.length > 1) last = word.slice(-2, -1);
      const smallMap = {'ゃ':'や','ゅ':'ゆ','ょ':'よ','っ':'つ','ぁ':'あ','ぃ':'い','ぅ':'う','ぇ':'え','ぉ':'お'};
      return smallMap[last] || last;
    }

    function cpuTurn() {
      const candidates = DICT.filter(w => w[0] === targetChar && !usedWords.has(w) && w.slice(-1) !== 'ん');
      if (candidates.length > 0) {
        const cpuWord = candidates[Math.floor(Math.random() * candidates.length)];
        usedWords.add(cpuWord);
        addMsg(cpuWord, 'cpu', true);
        targetChar = getNextChar(cpuWord);
        document.getElementById('target-char').innerText = targetChar;
        updateTargetRow();
      } else {
        addMsg(`「参りました！「${targetChar}」から始まる言葉が思いつきません。代わりに答えて繋げてね！」`, 'cpu');
      }
    }

    function addMsg(text, sender, showDict = false) {
      const box = document.getElementById('chat-area');
      const div = document.createElement('div');
      div.className = `msg-bubble msg-${sender}`;
      div.innerText = text;
      
      if (showDict) {
        const link = document.createElement('div');
        link.className = 'dict-link';
        link.innerText = '🔍 辞書で調べる';
        link.onclick = () => {
          window.open(`https://search.yahoo.co.jp/search?p=${encodeURIComponent(text)}+意味`, '_blank');
        };
        div.appendChild(link);
      }
      
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function toggleMode() {
      isCpuMode = !isCpuMode;
      document.getElementById('mode-label').innerText = isCpuMode ? "VS CPU" : "ソロ無限";
    }

    function resetGame() {
      usedWords = new Set(["しりとり"]);
      targetChar = "り";
      turn = 1;
      currentInput = "";
      document.getElementById('turn-count').innerText = 1;
      document.getElementById('target-char').innerText = "り";
      updateInputDisplay();
      document.getElementById('chat-area').innerHTML = `
        <div class="msg-bubble msg-cpu">
          【スタート】しりとり<br>
          「り」から始まる言葉を入力してね！
        </div>
      `;
      updateTargetRow();
    }

    init();
  </script>
</body>
</html>
